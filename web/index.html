<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Observatorio de Deserción — UNAD</title>
  <!-- stlite: Streamlit compilado a WebAssembly. Version PINNEADA. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
  <style>
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #ffffff;
      font-family: -apple-system, "Segoe UI", sans-serif; color: #004B8D; z-index: 10;
      text-align: center; padding: 0 24px; }
    .spinner { width: 48px; height: 48px; border: 5px solid #FFC20E;
      border-top-color: #004B8D; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #5a6b7a; max-width: 420px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <strong>Cargando el entorno de análisis (Python en su navegador)</strong>
    <p>La primera visita descarga el runtime y puede tomar de 10 a 30 segundos.
       Las siguientes cargas son mucho más rápidas.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

    // Rutas ABSOLUTAS same-origin: el worker de stlite puede resolver las rutas
    // relativas contra el CDN, no contra CloudFront.
    const abs = (p) => new URL(p, window.location.href).href;

    // El manifest dicta qué archivos de datos existen (el pipeline lo regenera
    // en cada publicación). Si aún no hay datos, la app arranca vacía sin fallar.
    let dataFiles = [];
    try {
      const res = await fetch(abs("data/manifest.json"), { cache: "no-cache" });
      if (res.ok) {
        const manifest = await res.json();
        dataFiles = (manifest.files || []).map((f) => f.replace(/^data\//, ""));
      }
    } catch (err) {
      console.warn("Sin manifest de datos aún:", err);
    }

    const files = {
      "app.py": { url: abs("app.py") },
      ".streamlit/config.toml": { url: abs("config.toml") },
    };
    for (const f of dataFiles) files[`data/${f}`] = { url: abs(`data/${f}`) };

    mount(
      { requirements: ["pandas", "plotly"], entrypoint: "app.py", files },
      document.getElementById("root")
    );

    // Retirar el loader cuando Streamlit pinte contenido
    new MutationObserver((_, obs) => {
      const root = document.getElementById("root");
      if (root.querySelector('[data-testid="stApp"], .stApp')) {
        document.getElementById("loading")?.remove();
        obs.disconnect();
      }
    }).observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
</body>
</html>
